# iii Engine Configuration — distributed multi-VM deployment
#
# Runs on engine-vm only. inference-worker and caller-worker live on
# separate private-subnet VMs and connect via III_URL=ws://<engine-private-ip>:49134

workers:
  - name: iii-observability
    config:
      enabled: true
      service_name: iii
      exporter: memory
      memory_max_spans: 10000
      metrics_enabled: true
      metrics_exporter: memory
      logs_enabled: true
      logs_exporter: memory
      logs_console_output: true
      sampling_ratio: 1.0

  - name: iii-queue
    config:
      adapter:
        name: builtin

  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: /opt/iii/data/state_store.db

  - name: iii-http
    config:
      # Bind to all interfaces so the public IP can reach port 3111.
      # The AWS security group restricts this port to 0.0.0.0/0 (HTTP API).
      host: 0.0.0.0
      port: 3111
      default_timeout: 30000
      concurrency_request_limit: 1024
      cors:
        allowed_origins:
          - "*"
        allowed_methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
